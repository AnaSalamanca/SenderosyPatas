<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Senderos y Patas</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>

<header>
    <img src="Imagenes/LOGO.png" width="150" alt="Senderos y Patas Logo" class="logo">
    <h1>Senderos y Patas</h1>
</header>

<div id="nav-placeholder"></div>

<main>
    <section id="Contacto">
        <h2>Contacto</h2>
        <p>Para más información contáctanos:</p>
        <p>Email: senderosypatas@gmail.com</p>
        <p>Teléfono: 3222471283</p>

        <h3>Envíanos un mensaje</h3>
        <form id="formulario" action="#" method="post">
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            
            <label for="telefono">Teléfono:</label><br>
            <input type="text" id="telefono" name="telefono" required><br>
            
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br>
            
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </section>
</main>
<footer>
    <p>&copy; 2024 Senderos y Patas. Todos los derechos reservados.</p>
    <p>
        Síguenos en:
        <a href="https://facebook.com/SenderosyPatas" target="_blank" class="social-icon facebook">
            <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://instagram.com/SenderosyPatas" target="_blank" class="social-icon instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://wa.me/1234567890" target="_blank" class="social-icon whatsapp">
            <i class="fab fa-whatsapp"></i>
        </a>
    </p>
    <p>Contacto: <a href="mailto:senderosypatas@gmail.com">senderosypatas@gmail.com</a></p>
</footer>

<script src="JS/Funciones.js"></script>

</body>
</html>
